<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI看线 · A股技术分析终端</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="4"  y="8"  width="3" height="8"  rx="0.6" fill="#f6465d"/>
                    <rect x="5.2" y="5"  width="0.7" height="14" fill="#f6465d"/>
                    <rect x="10.5" y="6" width="3" height="9" rx="0.6" fill="#2ebd85"/>
                    <rect x="11.7" y="3" width="0.7" height="15" fill="#2ebd85"/>
                    <rect x="17" y="10" width="3" height="7" rx="0.6" fill="#f0b90b"/>
                    <rect x="18.2" y="7" width="0.7" height="13" fill="#f0b90b"/>
                </svg>
                <div class="brand-text">
                    <span class="brand-name">股票分析</span>
                    <span class="brand-sub">技术面、基本面、资金面、新闻舆情</span>
                </div>
            </div>
            <div class="topbar-meta">
                <span class="meta-chip"><i class="dot dot-live"></i>Tushare 数据源</span>
                <span class="meta-chip"><i class="dot dot-live"></i>DeepSeek 模型</span>
            </div>
        </div>
    </header>

    <main class="layout">
        <!-- 左侧控制面板 -->
        <aside class="panel side">
            <div class="panel-head">
                <span class="panel-dot" style="background:#f0b90b"></span>
                <h2>参数栏</h2>
            </div>
            <form id="analyzeForm" class="control-form">
                <label class="field">
                    <span class="field-label">股票代码</span>
                    <input type="text" id="stockCode" name="stock_code" class="text-input mono"
                           placeholder="000001 / 600519 / 300750" autocomplete="off" required>
                </label>

                <div class="field">
                    <span class="field-label">分析周期</span>
                    <div class="period-pills" id="periodPills">
                        <button type="button" class="pill" data-value="1年">1年</button>
                        <button type="button" class="pill" data-value="6个月">6个月</button>
                        <button type="button" class="pill" data-value="3个月">3个月</button>
                        <button type="button" class="pill" data-value="1个月">1个月</button>
                    </div>
                    <select id="period" name="period" class="hidden-select" aria-hidden="true" tabindex="-1">
                        <option value="" selected></option>
                        <option value="1年">1年</option>
                        <option value="6个月">6个月</option>
                        <option value="3个月">3个月</option>
                        <option value="1个月">1个月</option>
                    </select>
                </div>

                <label class="field">
                    <span class="field-label">开始日期</span>
                    <input type="date" id="startDate" name="start_date" class="text-input mono"
                           max="" autocomplete="off">
                </label>

                <label class="field">
                    <span class="field-label">结束日期</span>
                    <input type="date" id="endDate" name="end_date" class="text-input mono"
                           max="" autocomplete="off">
                </label>

                <button type="submit" class="run-btn" id="runBtn">
                    <span class="run-btn-text">开始分析</span>
                </button>
            </form>

            <!-- 股票基本信息 -->
            <div id="stockInfoCard" class="info-card hidden">
                <div class="panel-head">
                    <span class="panel-dot" style="background:#2ebd85"></span>
                    <h2>股票基本信息</h2>
                </div>
                <div id="stockInfoBody" class="info-body"></div>
            </div>
        </aside>

        <!-- 右侧结果区 -->
        <section class="panel main-area">
            <!-- 估值与交易指标卡片 -->
            <div id="metricCards" class="metric-cards hidden"></div>

            <!-- 空状态 -->
            <div id="emptyState" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" class="empty-icon">
                    <path d="M3 17l5-6 4 3 6-8 3 4" stroke="#2a3444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 21h18" stroke="#2a3444" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <p>输入股票代码，开始分析</p>
                <p class="empty-hint">行情 · 财务 · 新闻 · 技术指标 · AI 解读</p>
            </div>

            <!-- 加载状态 -->
            <div id="loadingIndicator" class="loading-state hidden">
                <div class="loading-bars">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <p class="loading-text">正在分析，请稍候…</p>
                <p class="loading-sub">拉取行情与财务数据 → 计算技术指标 → 生成图表 → AI 解读</p>
            </div>

            <!-- 图表区 -->
            <div id="chartsArea" class="result-block hidden">
                <div class="panel-head">
                    <span class="panel-dot" style="background:#f6465d"></span>
                    <h2>交互式图表</h2>
                </div>
                <div id="chartImages" class="chart-area"></div>
            </div>

            <!-- AI 分析结果 -->
            <div id="analysisResult" class="result-block hidden">
                <div class="panel-head">
                    <span class="panel-dot" style="background:#8b5cf6"></span>
                    <h2>分析结果</h2>
                </div>
                <div id="analysisText" class="analysis-content"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© KK 仅供学习研究，不构成投资建议。投资有风险，入市需谨慎。</p>
    </footer>

    <div id="toast" class="toast hidden"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
